<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndeye Marieme Pene - Portfolio</title>
    <!-- Importation d'une police moderne (Google Fonts - Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .hero {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        .subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="subtitle">Étudiante en ingénierie et informatique</div>
        <h1>Ndeye Marieme Pene</h1>
        <p>Passionnée par le développement frontend, la création d'interfaces modernes et l'UI/UX design. Je conçois des expériences web interactives et élégantes.</p>
        <a href="#projets" class="btn">Voir mes projets</a>
    </section>

</body>
</html>
